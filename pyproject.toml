[project]
name = "meute"
version = "0.1.0"
description = "Claude Code session manager (CLI/TUI)"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
    "tomlkit>=0.15.2",
    "typer>=0.27.3",
]

[project.scripts]
meute = "meute._entry:console"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "deptry>=0.25.1",
    "hypothesis>=6.170.1",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "syrupy>=6.1.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
# Ruff 0.17 formats Markdown code blocks; the docs hold illustrative snippets, not source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
# COM812 and ISC001 conflict with the formatter; CPY demands a copyright header.
ignore = ["COM812", "ISC001", "CPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "use isinstance or a TypeGuard"

[tool.ruff.lint.per-file-ignores]
# assert, docstrings, magic values, no __init__.py, test subprocesses
"tests/**" = ["S101", "D", "PLR2004", "INP001", "S603"]
# docstrings are required in meute.core only
"src/meute/{tmux,git,claude,tui,mcp,cli,ingest}/**" = ["D"]
"src/meute/{_entry,__main__}.py" = ["D"]
"src/meute/{cli,ingest}/**" = ["T20"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportMatchNotExhaustive = "error"

[tool.importlinter]
root_package = "meute"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core, tmux and git are independent"
type = "independence"
modules = ["meute.core", "meute.tmux", "meute.git"]

[[tool.importlinter.contracts]]
name = "tui, mcp and claude are independent"
type = "independence"
modules = ["meute.tui", "meute.mcp", "meute.claude"]

[[tool.importlinter.contracts]]
name = "lower layers import no UI or heavy dependency"
type = "forbidden"
source_modules = ["meute.core", "meute.tmux", "meute.git", "meute.ingest", "meute.claude"]
forbidden_modules = [
    "typer",
    "textual",
    "mcp",
    "tomlkit",
    "meute.cli",
    "meute.tui",
    "meute.mcp",
]

[[tool.importlinter.contracts]]
name = "ingest only imports the stdlib and meute.core"
type = "forbidden"
source_modules = ["meute.ingest"]
forbidden_modules = ["meute.tmux", "meute.git", "meute.claude"]

[[tool.importlinter.contracts]]
name = "core, tmux and git import no other meute package"
type = "forbidden"
source_modules = ["meute.core", "meute.tmux", "meute.git"]
forbidden_modules = [
    "meute.ingest",
    "meute.claude",
    "meute.tui",
    "meute.mcp",
    "meute.cli",
    "meute._entry",
]

[[tool.importlinter.contracts]]
name = "ingest, claude, tui and mcp import neither tmux nor git"
type = "forbidden"
source_modules = ["meute.ingest", "meute.claude", "meute.tui", "meute.mcp"]
forbidden_modules = ["meute.tmux", "meute.git"]

# meute.cli assembles everything, so its indirect imports (cli -> tui -> textual) are expected.
[[tool.importlinter.contracts]]
name = "textual belongs to meute.tui"
type = "forbidden"
source_modules = [
    "meute.core", "meute.tmux", "meute.git", "meute.ingest", "meute.claude", "meute.mcp",
    "meute.cli", "meute._entry",
]
forbidden_modules = ["textual"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "mcp belongs to meute.mcp"
type = "forbidden"
source_modules = [
    "meute.core", "meute.tmux", "meute.git", "meute.ingest", "meute.claude", "meute.tui",
    "meute.cli", "meute._entry",
]
forbidden_modules = ["mcp"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "typer and tomlkit belong to meute.cli"
type = "forbidden"
source_modules = [
    "meute.core", "meute.tmux", "meute.git", "meute.ingest", "meute.claude", "meute.tui",
    "meute.mcp",
]
forbidden_modules = ["typer", "tomlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -n auto --strict-markers -p no:cacheprovider"
xfail_strict = true

[tool.mutmut]
source_paths = [
    "src/meute/core/", "src/meute/git/", "src/meute/tmux/parse.py", "src/meute/tmux/conf.py",
    "src/meute/claude/",
]
also_copy = ["tests/", "src/meute/"]
# In-process core tests only: CLI, guard and import-time tests spawn subprocesses that cannot see mutants.
pytest_add_cli_args = ["-n", "0"]
pytest_add_cli_args_test_selection = [
    "tests/test_config.py", "tests/test_config_edit.py", "tests/test_db_open.py",
    "tests/test_db_projects.py", "tests/test_db_repos.py", "tests/test_db_task_notes.py", "tests/test_db_tasks.py",
    "tests/test_db_task_update.py", "tests/test_due_parse.py", "tests/test_instants.py",
    "tests/test_migrations.py", "tests/test_paths.py", "tests/test_quick_add.py",
    "tests/test_render.py", "tests/test_status.py", "tests/test_task_model.py",
    "tests/test_views.py", "tests/test_session_state.py", "tests/test_session_model.py",
    "tests/test_db_sessions.py", "tests/test_db_concurrent_open.py", "tests/test_text.py",
    "tests/test_reconcile.py", "tests/test_mutants_db.py", "tests/test_mutants_config.py",
    "tests/test_mutants_model.py", "tests/test_tmux_parse.py", "tests/test_tmux_version.py",
    "tests/test_tmux_conf.py", "tests/test_git_kind.py", "tests/test_git_discover.py", "tests/test_board_view.py", "tests/test_board_view_claude.py", "tests/test_config_stuck.py",
    "tests/test_session_refresh.py", "tests/test_mutants_plan2.py", "tests/test_db_claude_sessions.py",
    "tests/test_hooks.py", "tests/test_db_hook_apply.py", "tests/test_reconcile_settled.py",
    "tests/test_session_refresh_settled.py", "tests/test_statusline_parse.py", "tests/test_db_samples.py", "tests/test_statusline_render.py", "tests/test_clock.py", "tests/test_claude_settings.py", "tests/test_claude_launch.py",
    "tests/test_agents_parse.py", "tests/test_agents_rules.py", "tests/test_board_view_outside.py", "tests/test_session_refresh_agents.py",
    "tests/test_agents_poller.py", "tests/test_refresh_stuck.py", "tests/test_board_purge.py",
    "tests/test_mutants_plan3.py", "tests/test_shared_helpers.py", "tests/test_refresh_stale_read.py", "tests/test_hooks_clear_resume.py", "tests/test_private_files.py",
]
