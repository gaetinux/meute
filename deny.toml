[advisories]
# Known vulnerabilities are denied (default behaviour of cargo-deny).
ignore = []

[licenses]
# Add other licenses only with a comment justifying the need.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# option-ext (MPL-2.0, weak file-level copyleft) is pulled in by `directories`
# (required by the spec for XDG paths); allowed for that crate only, unmodified.
exceptions = [{ allow = ["MPL-2.0"], crate = "option-ext" }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
