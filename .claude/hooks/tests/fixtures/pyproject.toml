[project]
name = "fixture"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# Pinned to the versions of the root uv.lock.
dev = [
    "basedpyright==1.40.2",
    "import-linter==2.15",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "CPY"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "INP001"]

[tool.basedpyright]
pythonVersion = "3.13"
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.importlinter]
root_package = "fixture"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "fixture does not import typer"
type = "forbidden"
source_modules = ["fixture"]
forbidden_modules = ["typer"]
